name: CodeQL

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL C/C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    env:
      NGINX_VERSION: "1.31.8"

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.2
        with:
          languages: c-cpp
          build-mode: manual

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake perl \
            zlib1g-dev libpcre2-dev libssl-dev \
            curl ca-certificates

      - name: Build brotli deps (from submodule)
        run: |
          cd deps/brotli
          mkdir -p out && cd out
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/installed" ..
          cmake --build . --config Release --target brotlienc

      - name: Download and build selected nginx with ngx_brotli (dynamic module)
        run: |
          curl -fsSL "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" -o nginx.tar.gz
          tar -xzf nginx.tar.gz
          cd "nginx-${NGINX_VERSION}"

          ./configure --with-compat --add-dynamic-module="${GITHUB_WORKSPACE}"
          make modules

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.2
        with:
          category: /language:c-cpp/os:${{ matrix.os }}
