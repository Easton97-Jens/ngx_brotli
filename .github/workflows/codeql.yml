name: CodeQL

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL C/C++ (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            os: ubuntu-24.04
            category: /language:c-cpp/os:ubuntu-24.04
          - name: ubuntu-26.04
            os: ubuntu-26.04
            category: /language:c-cpp/os:ubuntu-26.04
          # Keep the original analysis identity so GitHub can compare its history.
          - name: legacy analysis baseline
            os: ubuntu-24.04
            category: .github/workflows/codeql.yml:analyze
    env:
      NGINX_VERSION: "1.31.8"

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake perl \
            zlib1g-dev libpcre2-dev libssl-dev \
            curl ca-certificates

      - name: Build brotli deps (from submodule)
        run: |
          cd deps/brotli
          mkdir -p out && cd out
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DCMAKE_INSTALL_PREFIX="$PWD/installed" ..
          cmake --build . --config Release --target brotlienc

      - name: Download and build selected nginx with ngx_brotli (dynamic module)
        run: |
          curl -fsSL "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" -o nginx.tar.gz
          tar -xzf nginx.tar.gz
          cd "nginx-${NGINX_VERSION}"

          ./configure --with-compat --add-dynamic-module="${GITHUB_WORKSPACE}"
          make modules

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: ${{ matrix.category }}
