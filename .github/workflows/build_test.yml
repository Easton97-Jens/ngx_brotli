name: Build/Test

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu_build:
    name: Build and test nginx ${{ matrix.nginx_version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        # Latest releases from the legacy, stable, and mainline branches.
        nginx_version: ["1.28.3", "1.30.6", "1.31.8"]
    env:
      CC: gcc
      CXX: g++
      NGINX_VERSION: ${{ matrix.nginx_version }}
    steps:
      - name: Checkout the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Match ModSecurity's ci_new.yml: choose the newest Lua in this Ubuntu release.
      - name: Detect latest Lua dev package
        id: detect_lua
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          CANDIDATES="$(apt-cache pkgnames | grep -E '^liblua[0-9]+\.[0-9]+-dev$' || true)"
          if [ -z "$CANDIDATES" ]; then
            echo "No libluaX.Y-dev package found" >&2
            exit 1
          fi
          BEST_PKG="$(
            printf '%s\n' "$CANDIDATES" \
              | sed -E 's/^liblua([0-9]+\.[0-9]+)-dev$/\1 &/' \
              | sort -V \
              | tail -n1 \
              | awk '{print $2}'
          )"
          if [ -z "$BEST_PKG" ]; then
            echo "Failed to determine Lua package" >&2
            exit 1
          fi
          echo "lua_pkg=$BEST_PKG" >> "$GITHUB_OUTPUT"
          echo "Using $BEST_PKG"

      - name: Install build and test dependencies
        env:
          LUA_DEV_PACKAGE: ${{ steps.detect_lua.outputs.lua_pkg }}
        run: |
          LUA_PACKAGE="${LUA_DEV_PACKAGE#lib}"
          LUA_PACKAGE="${LUA_PACKAGE%-dev}"
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git \
            libatomic-ops-dev libbrotli-dev libgd-dev libgeoip-dev \
            libpcre2-dev libssl-dev libxslt1-dev lld pkg-config zlib1g-dev \
            "$LUA_DEV_PACKAGE" "$LUA_PACKAGE"

      - name: Checkout selected nginx release
        run: |
          git clone --depth 1 --branch "release-${NGINX_VERSION}" \
            https://github.com/nginx/nginx.git nginx

      - name: Run compile script
        run: script/.actions-compile.sh
      - name: Run before test script
        run: script/.actions-before-test.sh
      - name: Test script
        run: script/.actions-test.sh
