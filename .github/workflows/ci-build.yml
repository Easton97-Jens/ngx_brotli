name: CI Build

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Dynamic modules nginx ${{ matrix.nginx_version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        nginx_version:
          - "1.28.3"
          - "1.30.6"
          - "1.31.8"
    env:
      NGINX_VERSION: ${{ matrix.nginx_version }}
      CC: gcc
      CFLAGS: "-Wall -Wextra -Werror"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            libbrotli-dev \
            libpcre2-dev \
            libssl-dev \
            pkg-config \
            zlib1g-dev

      - name: Download NGINX
        run: |
          curl -fsSLO "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          tar -xzf "nginx-${NGINX_VERSION}.tar.gz"

      - name: Configure NGINX with ngx_brotli
        working-directory: nginx-${{ matrix.nginx_version }}
        run: |
          ./configure \
            --with-compat \
            --add-dynamic-module="${GITHUB_WORKSPACE}" \
            --with-cc-opt="-Wall -Wextra -Werror"

      - name: Build dynamic modules
        working-directory: nginx-${{ matrix.nginx_version }}
        run: |
          make modules
